name: Delete Azure Resources to Reduce Billing in Trial Account

on:
  schedule:
    - cron: 0 19 * * *
# ┌───────────── minute (0 - 59)
# │ ┌───────────── hour (0 - 23)
# │ │ ┌───────────── day of the month (1 - 31)
# │ │ │ ┌───────────── month (1 - 12 or JAN-DEC)
# │ │ │ │ ┌───────────── day of the week (0 - 6 or SUN-SAT)
# │ │ │ │ │
# * * * * *
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  delete-resources:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout branch ${{ github.ref_name }}
      uses: actions/checkout@v6.0.2
      
    - name: Azure Login
      uses: Azure/login@v2.3.0
      with:
        client-id: a8c850c9-464f-430e-90cc-8f12faae058c
        tenant-id: 339559c0-6f37-4a05-baa6-05eeb41c6cd2
        subscription-id: f9fb190e-2a79-4b5f-b614-0f469a025fb0

    - name: Check Current Azure Account
      uses: Azure/cli@v2.2.0
      with:
        # Specify the script here
        inlineScript: |
          az account show
          
    - name: Delete Azure Resource Groups
      uses: Azure/cli@v2.2.0
      with:
        # Specify the script here
        inlineScript: |
          # LOCK_IDS=$(az lock list \
          # --resource-group "$RG_NAME" \
          # --query "[].id" \
          # -o tsv)

          # if [[ -z "$LOCK_IDS" ]]; then
          #   echo "✅ No locks found."
          # else
          #   echo "🧹 Removing locks..."
          #   while read -r LOCK_ID; do
          #     echo "Deleting lock: $LOCK_ID"
          #     az lock delete --ids "$LOCK_ID"
          #   done <<< "$LOCK_IDS"
          # fi
          
          for rg in $(az group list --query "[].name" -o tsv); do
            echo "Deleting resource group: $rg"
            az group delete --name "$rg" --yes --no-wait
          done
    
        
   
  
